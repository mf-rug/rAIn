name: radar

# Triggered every 5 minutes by cron-job.org (workflow_dispatch, punctual).
# GitHub's own schedule is only a fallback, since it often starts runs late.
# Pushes to main redeploy the site with the app changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '1-59/15 * * * *'

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The data branch is the job's storage between runs: the frames published
      # last time, so only new ones need fetching.
      - name: Fetch previous output
        run: |
          mkdir -p out
          if git ls-remote --exit-code origin data >/dev/null; then
            git fetch -q --depth=1 origin data
            git --work-tree=out checkout origin/data -- .
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: job/requirements.txt

      - run: pip install -q -r job/requirements.txt

      - name: Build frames
        id: build
        run: python job/build.py out
        timeout-minutes: 6
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}

      # A single commit, replaced each time, so the repo doesn't grow.
      - name: Store frames
        if: steps.build.outputs.changed == 'true'
        working-directory: out
        run: |
          git init -q -b data
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "radar $(jq -r .t0 index.json), forecast $(jq -r .ref index.json)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The site is the app plus the frames under data/. A Pages deployment
      # purges the Pages CDN, so the app always sees the newest index.
      - name: Assemble site
        if: steps.build.outputs.changed == 'true' || github.event_name == 'push'
        run: |
          mkdir site
          git archive HEAD | tar -x -C site
          rm -rf site/job site/.github site/.gitignore
          mkdir site/data
          cp out/index.json out/skill.json out/coverage.json out/*.png site/data/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.changed == 'true' || github.event_name == 'push'
        with:
          path: site

      - id: deploy
        if: steps.build.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
